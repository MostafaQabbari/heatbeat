[project]
name = "heatbeat"
version = "0.1.0"
description = "Vendor-neutral heating-plant monitoring: MQTT ingest, TimescaleDB, FastAPI"
readme = "README.md"
authors = [
    { name = "Mostafa" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "celery>=5.6.3",
    "fastapi>=0.156.4",
    "httpx2>=2.15.1",
    "paho-mqtt>=2",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

# Commands you can run with `uv run <name>`
[project.scripts]
heatbeat-bridge = "heatbeat.bridge:main"
heatbeat-simulator = "heatbeat.simulator:main"
heatbeat-api = "heatbeat.api.main:run"
heatbeat-openapi = "heatbeat.api.main:write_openapi"
heatbeat-seed = "heatbeat.seed:main"
heatbeat-worker = "heatbeat.worker:worker_main"
heatbeat-beat = "heatbeat.worker:beat_main"
heatbeat-job = "heatbeat.worker:run_once_main"

[build-system]
requires = ["uv_build>=0.11.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real database and broker (docker compose up -d db mqtt)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S104", "S311", "RUF001", "RUF003", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S608"]
"migrations/**" = ["S608"]  # SQL built only from constants in the migration itself

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["paho.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["heatbeat.worker"]
disallow_untyped_decorators = false  # Celery has no type hints
