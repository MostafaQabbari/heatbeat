[project]
name = "heatbeat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MostafaQabbari", email = "mkabary8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
]

