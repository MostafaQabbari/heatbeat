# What this file does: tells Prometheus what to scrape (every 15 s) and which alert rules to load.
# Targets: the containers of the "app" profile, or processes on your computer
# (host.docker.internal; they must then listen on 0.0.0.0: set HB_API_HOST=0.0.0.0).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]
  - job_name: bridge
    static_configs:
      - targets: ["bridge:9101", "host.docker.internal:9101"]
