# What this file does: configures the MQTT broker (Mosquitto) for local development.

listener 1883

# DEVELOPMENT ONLY. In production: TLS, one username/password or certificate per
# gateway, and an ACL so a gateway can only publish to its own topics.
allow_anonymous true

# Keep queued messages and sessions on disk, so a broker restart loses nothing.
persistence true
persistence_location /mosquitto/data/

# How many unacknowledged messages may be "in flight" to one client. The bridge
# acknowledges only after the database commit, so this limit is our backpressure.
max_inflight_messages 1000

# How many messages to queue for a disconnected persistent client (bridge down).
max_queued_messages 100000
