# What this file does: the same pipeline as .github/workflows/ci.yml, written for
# GitLab CI. It is only used if the project is pushed to or mirrored on GitLab.

stages: [quality, integration, security, build]

default:
  image: ghcr.io/astral-sh/uv:0.13.1-python3.13-trixie-slim

variables:
  UV_LINK_MODE: copy

quality:
  stage: quality
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - uv run pytest

integration:
  stage: integration
  services:
    - name: timescale/timescaledb:2.17.2-pg17
      alias: db
    - name: eclipse-mosquitto:2.0.20
      alias: mqtt
      command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
  variables:
    POSTGRES_DB: heatbeat_test
    POSTGRES_USER: heatbeat
    POSTGRES_PASSWORD: ci-only-password
    HB_DB_PASSWORD: ci-only-password
    HB_TEST_DATABASE_URL: postgresql://heatbeat:ci-only-password@db:5432/heatbeat_test
    HB_TEST_MQTT_HOST: mqtt
  script:
    - uv sync --locked
    - uv run pytest -m integration

portal:
  stage: quality
  image: mcr.microsoft.com/playwright:v1.56.0-noble   # Node + browsers for the e2e tests
  before_script:
    - cd portal
  script:
    - npm ci
    - npx openapi-typescript ../docs/openapi.json -o /tmp/schema.d.ts && diff /tmp/schema.d.ts src/api/schema.d.ts
    - npm run typecheck
    - npm test
    - npm run test:e2e
    - npm audit --omit=dev --audit-level=high

monitoring:
  stage: quality
  image:
    name: prom/prometheus:v3.1.0
    entrypoint: [""]
  script:
    - mkdir -p /tmp/prom && cp monitoring/*.yml /tmp/prom/
    - sed -i 's#/etc/prometheus/alerts.yml#/tmp/prom/alerts.yml#' /tmp/prom/prometheus.yml
    - promtool check config /tmp/prom/prometheus.yml

dependency_audit:
  stage: security
  script:
    - uv export --format requirements-txt --no-dev --no-emit-project -o requirements.txt
    - uvx pip-audit -r requirements.txt --disable-pip

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose

image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build -t heatbeat:$CI_COMMIT_SHORT_SHA .
    - docker build -t heatbeat-portal:$CI_COMMIT_SHORT_SHA portal
