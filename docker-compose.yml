# What this file does: starts everything Heatbeat needs.
#
#   docker compose up -d                          database, MQTT broker, Redis, Mailpit (development)
#   docker compose --profile monitoring up -d     + Prometheus (9090) and Grafana (3300)
#   docker compose --profile app up -d --build    + all Heatbeat services in containers
#
# Ports are bound to 127.0.0.1, so they are reachable from this computer only.
name: heatbeat

x-app: &app
  build: .
  environment: &app-env
    HB_DB_HOST: db
    HB_DB_PASSWORD: ${HB_DB_PASSWORD}
    HB_MQTT_HOST: mqtt
    HB_REDIS_URL: redis://redis:6379/0
    HB_SMTP_HOST: mailpit
    HB_JWT_SECRET: ${HB_JWT_SECRET:-}
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_DB: heatbeat
      POSTGRES_USER: heatbeat
      POSTGRES_PASSWORD: ${HB_DB_PASSWORD:?set HB_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatbeat -d heatbeat"]
      interval: 2s
      timeout: 3s
      retries: 30

  mqtt:
    image: eclipse-mosquitto:2.0.20
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6379:6379"]

  mailpit:  # catches all alarm e-mails; web UI on http://127.0.0.1:8025
    image: axllent/mailpit:v1.21.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.1.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.4.0
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # local demo only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  migrate:
    <<: *app
    profiles: [app]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  seed:
    <<: *app
    profiles: [app]
    command: ["heatbeat-seed", "--plants", "9", "--password", "${HB_DEMO_PASSWORD:-change-me-demo}"]
    restart: "no"
    depends_on:
      migrate: { condition: service_completed_successfully }

  bridge:
    <<: *app
    profiles: [app]
    command: ["heatbeat-bridge"]
    environment:
      <<: *app-env
      HB_API_HOST: 0.0.0.0  # also the metrics listen address
    depends_on:
      seed: { condition: service_completed_successfully }
      mqtt: { condition: service_started }

  api:
    <<: *app
    profiles: [app]
    command: ["heatbeat-api"]
    environment:
      <<: *app-env
      HB_API_HOST: 0.0.0.0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    profiles: [app]
    command: ["heatbeat-worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  beat:
    <<: *app
    profiles: [app]
    command: ["heatbeat-beat"]
    depends_on:
      redis: { condition: service_started }

  simulator:
    <<: *app
    profiles: [app]
    command: ["heatbeat-simulator", "--plants", "9", "--backfill-hours", "6", "--with-faults", "--interval", "30"]
    depends_on:
      bridge: { condition: service_started }

  portal:
    profiles: [app]
    build: ./portal
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_started }

volumes:
  db-data:
  mqtt-data:
